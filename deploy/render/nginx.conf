# nginx for the single Render container (deploy/render/Dockerfile). Mirrors
# frontend/nginx.conf, but runs unprivileged, listens on Render's $PORT
# (start.sh replaces __PORT__) and proxies to the API on localhost.
worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;

events { worker_connections 256; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;

    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    # Request line without the query string: query strings can carry tokens.
    log_format sfci '$http_x_forwarded_for [$time_iso8601] "$request_method $uri" $status $body_bytes_sent $request_time';
    access_log /dev/stdout sfci;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    server {
        listen __PORT__;
        server_name _;
        root /srv/www;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location /api/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Render terminates TLS in front of this container.
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            client_max_body_size 25m;
        }

        # Hashed file names: cache forever.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable" always;
            add_header X-Content-Type-Options nosniff always;
            try_files $uri =404;
        }

        # Client-side routes fall back to the app shell, which is never cached.
        location / {
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy no-referrer always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
            try_files $uri /index.html;
        }
    }
}
