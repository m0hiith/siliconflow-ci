<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-label="Failure triage: a failed stage log is classified and routed to the firmware developer, the hardware lab, or the CI platform team">
  <style>
    .card{fill:#ffffff;stroke:#d0d7de}
    .t{fill:#1f2328;font:600 15px -apple-system,Segoe UI,Helvetica,Arial,sans-serif}
    .s{fill:#57606a;font:12.5px -apple-system,Segoe UI,Helvetica,Arial,sans-serif}
    .m{fill:#57606a;font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .lane{fill:#57606a;font:600 12px -apple-system,Segoe UI,Helvetica,Arial,sans-serif;letter-spacing:1px}
    .bg{fill:#f6f8fa}
    .arrow{stroke:#8c959f;stroke-width:2.5;fill:none}
    .log{fill:#1f2328}
    .lt{fill:#e6edf3;font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .le{fill:#ff7b72;font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    @media (prefers-color-scheme: dark){
      .card{fill:#161b22;stroke:#30363d}.t{fill:#e6edf3}.s{fill:#9198a1}.m{fill:#9198a1}
      .bg{fill:#0d1117}.lane{fill:#9198a1}.arrow{stroke:#6e7681}.log{fill:#010409}
    }
  </style>
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#8c959f"/>
    </marker>
  </defs>
  <rect class="bg" width="960" height="300" rx="14"/>
  <text class="lane" x="30" y="36">A RED BUILD SAYS WHO NEEDS TO ACT, NOT JUST "FAILED"</text>

  <g transform="translate(30 62)">
    <rect class="log" width="270" height="200" rx="12"/>
    <text class="lt" x="18" y="32">$ stage log (redacted)</text>
    <text class="lt" x="18" y="62">[ 41%] Building C object ...</text>
    <text class="le" x="18" y="86">error: 'x' undeclared</text>
    <text class="lt" x="18" y="116">... or ...</text>
    <text class="le" x="18" y="140">No J-Link found</text>
    <text class="lt" x="18" y="170">... or ...</text>
    <text class="le" x="18" y="194">No space left on device</text>
  </g>

  <g transform="translate(340 112)">
    <rect width="150" height="100" rx="12" fill="#8250df"/>
    <text x="75" y="44" fill="#fff" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700">classify.py</text>
    <text x="75" y="68" fill="#fff" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12">first matching error line</text>
  </g>

  <g transform="translate(540 52)">
    <rect class="card" width="390" height="66" rx="10"/>
    <rect width="8" height="66" rx="4" fill="#cf222e"/>
    <text class="t" x="24" y="27">Firmware developer</text>
    <text class="m" x="24" y="50">compile · link · size · test · analysis</text>
  </g>
  <g transform="translate(540 130)">
    <rect class="card" width="390" height="66" rx="10"/>
    <rect width="8" height="66" rx="4" fill="#bf8700"/>
    <text class="t" x="24" y="27">Hardware lab</text>
    <text class="m" x="24" y="50">infra_hw · no probe, OpenOCD failed</text>
  </g>
  <g transform="translate(540 208)">
    <rect class="card" width="390" height="66" rx="10"/>
    <rect width="8" height="66" rx="4" fill="#0969da"/>
    <text class="t" x="24" y="27">CI / platform team</text>
    <text class="m" x="24" y="50">infra_ci · disk full, OOM, DNS → errored</text>
  </g>

  <g class="arrow" marker-end="url(#f)">
    <path d="M302 162h34"/>
    <path d="M492 150C515 120 515 90 536 86"/>
    <path d="M492 162h44"/>
    <path d="M492 174C515 205 515 236 536 240"/>
  </g>
</svg>
