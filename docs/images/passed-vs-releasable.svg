<svg xmlns="http://www.w3.org/2000/svg" width="960" height="250" viewBox="0 0 960 250" role="img" aria-label="Two questions: did the build pass, and is the artifact release-eligible">
  <style>
    .card{fill:#ffffff;stroke:#d0d7de}
    .h{fill:#1f2328;font:700 18px -apple-system,Segoe UI,Helvetica,Arial,sans-serif}
    .s{fill:#57606a;font:14px -apple-system,Segoe UI,Helvetica,Arial,sans-serif}
    .q{fill:#0969da;font:600 13px -apple-system,Segoe UI,Helvetica,Arial,sans-serif;letter-spacing:1px}
    .bg{fill:#f6f8fa}
    @media (prefers-color-scheme: dark){
      .card{fill:#161b22;stroke:#30363d}.h{fill:#e6edf3}.s{fill:#9198a1}.bg{fill:#0d1117}.q{fill:#4493f8}
    }
  </style>
  <rect class="bg" width="960" height="250" rx="14"/>
  <g transform="translate(30 30)">
    <rect class="card" width="430" height="190" rx="12"/>
    <text class="q" x="24" y="36">QUESTION 1 · BUILD STATUS</text>
    <text class="h" x="24" y="68">Did the firmware build and pass?</text>
    <text class="s" x="24" y="100">✓ every required stage passed</text>
    <text class="s" x="24" y="124">✓ decided by the backend, from webhooks + run report</text>
    <text class="s" x="24" y="148">✓ set only by transitions.py, never by the runner</text>
    <rect x="24" y="160" width="74" height="22" rx="11" fill="#1a7f37"/>
    <text x="61" y="176" fill="#fff" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700">passed</text>
  </g>
  <text x="480" y="134" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="30" font-weight="700" fill="#8c959f">≠</text>
  <g transform="translate(500 30)">
    <rect class="card" width="430" height="190" rx="12"/>
    <text class="q" x="24" y="36">QUESTION 2 · RELEASE ELIGIBILITY</text>
    <text class="h" x="24" y="68">Is this exact binary allowed to ship?</text>
    <text class="s" x="24" y="100">✓ 0 test failures · ≥ 80% line coverage</text>
    <text class="s" x="24" y="124">✓ 0 cppcheck errors · .text under the size limit</text>
    <text class="s" x="24" y="148">✓ built from main or a v* tag (never a PR)</text>
    <rect x="24" y="160" width="128" height="22" rx="11" fill="#8250df"/>
    <text x="88" y="176" fill="#fff" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700">release-eligible</text>
  </g>
</svg>
