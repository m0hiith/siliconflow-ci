name: Toolchain image

on:
  push:
    branches: [main]
    paths:
      - "docker/toolchain/**"
      - ".github/workflows/toolchain-image.yml"
  pull_request:
    paths:
      - "docker/toolchain/**"
      - ".github/workflows/toolchain-image.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toolchain-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push to ghcr.io (only when PUSH is true)
    env:
      # Push only from main (push or manual run); PRs, including forks, build only.
      PUSH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Image name
        id: name
        # ghcr.io requires a lowercase repository path.
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sfci-toolchain" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: docker/toolchain
          platforms: linux/amd64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Print image digest
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "digest: $DIGEST"
          if [[ $PUSH == true ]]; then
            ref="$IMAGE@$DIGEST"
            echo "pin in firmware-ci.yml and firmware-ci-cortex-m4.yml: $ref"
            {
              echo "### Toolchain image"
              echo '```'
              echo "$ref"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "not pushed (pull request or non-main ref)"
          fi
